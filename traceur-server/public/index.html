<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>Traceur</title>
<meta name="description" content="Prototype d'appli qui transforme tes sorties Strava en stories Instagram automatiquement.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0e0e10;
    --surface:#19181b;
    --surface-2:#221f23;
    --line:#2d2a2f;
    --text:#f4f2f0;
    --text-dim:#98939a;
    --accent:#ff6a2e;
    --accent-2:#ffb22c;
    --danger:#ff5470;
    --ok:#37d67a;
    font-family:'Poppins',system-ui,sans-serif;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    margin:0;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }

  #app{
    width:100%;
    max-width:460px;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:5;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 14px;
    background:linear-gradient(var(--bg) 70%, transparent);
    display:flex;
    align-items:center;
    gap:12px;
  }
  .topbar h1{
    font-size:19px;
    font-weight:700;
    margin:0;
    letter-spacing:.2px;
  }
  .back-btn{
    width:34px;height:34px;border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex:none;
    font-size:18px;
    line-height:1;
  }
  .back-btn:hover{border-color:var(--accent);}
  .account-chip{
    margin-left:auto;
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--text-dim);
    background:var(--surface);
    border:1px solid var(--line);
    padding:6px 10px 6px 6px;
    border-radius:999px;
    white-space:nowrap;
  }
  .avatar{
    width:22px;height:22px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;color:#1a1210;
    flex:none;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--text-dim);flex:none;}
  .dot.ok{background:var(--ok);}
  .dot.warn{background:var(--accent-2);}
  .dot.busy{background:var(--accent-2);animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  /* ---------- screens ---------- */
  .screen{display:none;flex:1;flex-direction:column;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 28px);}
  .screen.active{display:flex;}

  .section-label{
    font-size:12px;
    letter-spacing:.08em;
    color:var(--text-dim);
    text-transform:uppercase;
    margin:18px 0 10px;
    font-weight:600;
  }

  /* ---------- connect panel ---------- */
  .connect-panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .connect-panel p{
    margin:0;
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .connect-panel p b{color:var(--text);}
  .connect-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12.5px;
    color:var(--text-dim);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .connect-row .dot{margin-right:2px;}
  .connect-row .link-btn{
    margin-left:auto;
    background:none;border:none;
    color:var(--accent-2);
    font-weight:700;font-size:12.5px;
    cursor:pointer;
    font-family:inherit;
  }

  /* ---------- activity cards ---------- */
  .activity-list{display:flex;flex-direction:column;gap:12px;}
  .activity-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
    position:relative;
  }
  .activity-card:hover{border-color:var(--accent);}
  .activity-card:active{transform:scale(.98);}
  .ac-top{display:flex;align-items:flex-start;gap:12px;}
  .ac-icon{
    width:40px;height:40px;border-radius:11px;
    background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
    flex:none;
    font-size:18px;
  }
  .ac-title{font-weight:600;font-size:15px;}
  .ac-sub{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .ac-cta{
    margin-left:auto;
    align-self:center;
    font-size:12px;font-weight:700;
    color:var(--accent-2);
    white-space:nowrap;
  }
  .ac-stats{
    display:flex;gap:16px;
    padding-top:10px;
    border-top:1px solid var(--line);
    font-variant-numeric:tabular-nums;
  }
  .ac-stat b{display:block;font-size:14px;font-weight:700;}
  .ac-stat span{display:block;font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:1px;}
  .demo-pill{
    display:inline-block;vertical-align:1px;margin-right:4px;
    font-size:9.5px;font-weight:700;letter-spacing:.04em;
    color:var(--text-dim);
    background:var(--surface-2);
    border:1px solid var(--line);
    padding:3px 7px;
    border-radius:999px;
    text-transform:uppercase;
  }

  /* ---------- story screen ---------- */
  .phone-frame{
    margin:16px auto 6px;
    width:min(78vw,300px);
    aspect-ratio:9/16;
    border-radius:28px;
    border:6px solid var(--surface-2);
    overflow:hidden;
    background:#000;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.7);
    position:relative;
  }
  .phone-frame canvas{width:100%;height:100%;display:block;}
  .canvas-overlay{
    position:absolute;inset:0;
    background:rgba(14,14,16,.82);
    display:none;
    align-items:center;justify-content:center;
    text-align:center;
    padding:20px;
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .canvas-overlay.show{display:flex;}

  .swatches{display:flex;gap:10px;justify-content:center;margin:18px 0 6px;}
  .swatch{
    width:38px;height:38px;border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    position:relative;
  }
  .swatch.selected{border-color:var(--text);}
  .swatch.selected::after{
    content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.5);
  }

  .btn{
    border:none;
    border-radius:14px;
    padding:15px 18px;
    font-family:inherit;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#1a1210;
    margin-top:16px;
  }
  .btn-primary:active{filter:brightness(.92);}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    margin-top:10px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
    transform:translateX(-50%) translateY(20px);
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:13px;
    font-weight:600;
    padding:12px 18px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:20;
    white-space:nowrap;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    max-width:90vw;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}

  .empty-note{
    font-size:12.5px;
    color:var(--text-dim);
    text-align:center;
    margin-top:auto;
    padding:20px 10px 4px;
    line-height:1.5;
  }
  body{margin:0;}
  .logout-btn{background:none;border:none;color:var(--text-dim);font-family:inherit;font-size:12px;cursor:pointer;margin-left:4px;text-decoration:underline;}
</style>
</head>
<body>

<div id="app">

  <!-- ===== ÉCRAN 1 : liste des activités ===== -->
  <div class="screen active" id="screen-home">
    <div class="topbar">
      <h1>Traceur</h1>
      <div class="account-chip" id="account-chip">
        <span class="dot" id="account-dot"></span>
        <span id="account-label">Hors-ligne</span>
      </div>
    </div>

    <div class="connect-panel" id="connect-panel">
      <p><b>Connecte ton compte Strava</b> pour générer des stories à partir de tes vraies sorties — sinon l'appli tourne avec 4 exemples.</p>
      <button class="btn btn-primary" id="connect-btn" style="margin-top:2px;">Se connecter avec Strava</button>
    </div>

    <div class="connect-row" id="connected-row" style="display:none;">
      <span class="dot ok"></span>
      <span id="connected-label">Connecté</span>
      <button class="link-btn" id="refresh-btn">Actualiser</button><button class="logout-btn" id="logout-btn">Déconnexion</button>
    </div>

    <div class="section-label">Sorties récentes</div>
    <div class="activity-list" id="activity-list"></div>

    <div class="empty-note">Touche une sortie pour générer sa story.</div>
  </div>

  <!-- ===== ÉCRAN 2 : aperçu / édition de la story ===== -->
  <div class="screen" id="screen-story">
    <div class="topbar">
      <button class="back-btn" id="back-btn">←</button>
      <h1 id="story-title">Story</h1>
    </div>

    <div class="phone-frame">
      <canvas id="story-canvas" width="1080" height="1920"></canvas>
      <div class="canvas-overlay" id="canvas-overlay">Chargement du tracé…</div>
    </div>

    <div class="section-label" style="text-align:center;">Couleur</div>
    <div class="swatches" id="swatches"></div>

    <button class="btn btn-primary" id="save-btn">⭳ Enregistrer / partager</button>
    <button class="btn btn-ghost" id="regen-btn">Regénérer l'aperçu</button>
  </div>

</div>

<div class="toast" id="toast"></div>

    }
  ];

  var SPORT_LABEL = {Run:"COURSE À PIED", TrailRun:"TRAIL", Ride:"VÉLO", Workout:"SÉANCE", Hike:"RANDONNÉE", Walk:"MARCHE"};
  var SPORT_ICON  = {Run:"🏃", TrailRun:"⛰️", Ride:"🚴", Workout:"🏋️", Hike:"🥾", Walk:"🚶"};
  var MONTHS_FR = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

  var PALETTES = [
    {name:"Ambre",  a:"#ff6a2e", b:"#ffb22c"},
    {name:"Lagon",  a:"#12c2c2", b:"#7bf1a8"},
    {name:"Violet", a:"#8b5cf6", b:"#f472b6"}
  ];

  var state = {
    activity:null,
    paletteIndex:0,
    activities: DEMO_ACTIVITIES.slice(),
    connectStatus:"idle",     // idle | connecting | connected | error | unavailable
    athleteName:null
  };

  // ---------------------------------------------------------------
  // Formatting helpers
  // ---------------------------------------------------------------
  function fmtPace(distanceM, movingS, sport){
    if(!distanceM || !movingS) return null;
    if(sport === "Ride"){
      var kmh = (distanceM/1000) / (movingS/3600);
      return kmh.toFixed(1) + " km/h";
    }
    var secPerKm = movingS / (distanceM/1000);
    var m = Math.floor(secPerKm/60), s = Math.round(secPerKm%60);
    if(s === 60){m++; s=0;}
    return m + ":" + String(s).padStart(2,"0") + " /km";
  }
  function fmtTime(seconds){
    seconds = seconds || 0;
    var h = Math.floor(seconds/3600), rem = seconds%3600;
    var m = Math.floor(rem/60), s = Math.round(rem%60);
    if(h) return h + "h" + String(m).padStart(2,"0");
    return m + "min" + String(s).padStart(2,"0");
  }
  function fmtDateFR(isoLocal){
    if(!isoLocal) return "";
    var d = new Date(isoLocal);
    if(isNaN(d.getTime())) return "";
    return d.getDate() + " " + MONTHS_FR[d.getMonth()] + " " + d.getFullYear();
  }

  // ---------------------------------------------------------------
  // Rendu de la story sur canvas 1080x1920
  // ---------------------------------------------------------------
  function projectRoute(points, box){
    var lats = points.map(function(p){return p[0];});
    var lons = points.map(function(p){return p[1];});
    var latMin=Math.min.apply(null,lats), latMax=Math.max.apply(null,lats);
    var lonMin=Math.min.apply(null,lons), lonMax=Math.max.apply(null,lons);
    var latSpan = Math.max(latMax-latMin, 1e-6);
    var lonSpan = Math.max(lonMax-lonMin, 1e-6);
    var bw = box.x1-box.x0, bh = box.y1-box.y0;
    var scale = Math.min(bw/lonSpan, bh/latSpan) * 0.85;
    var cx = box.x0 + bw/2, cy = box.y0 + bh/2;
    var lonC = (lonMin+lonMax)/2, latC=(latMin+latMax)/2;
    return points.map(function(p){
      return [ cx + (p[1]-lonC)*scale, cy - (p[0]-latC)*scale ];
    });
  }

  function renderStory(canvas, activity, palette){
    var ctx = canvas.getContext("2d");
    var W = canvas.width, H = canvas.height;

    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,"#121214");
    grad.addColorStop(1,"#1b1a1d");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    if(activity.route && activity.route.length > 1){
      var box = {x0:90, y0:520, x1:W-90, y1:1280};
      var pts = projectRoute(activity.route, box);

      ctx.save();
      ctx.strokeStyle = palette.a;
      ctx.lineWidth = 22;
      ctx.lineJoin = "round"; ctx.lineCap="round";
      ctx.shadowColor = palette.a;
      ctx.shadowBlur = 40;
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      pts.forEach(function(p,i){ i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]); });
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = palette.b;
      ctx.lineWidth = 7;
      ctx.lineJoin = "round"; ctx.lineCap="round";
      ctx.beginPath();
      pts.forEach(function(p,i){ i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]); });
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle="#ffffff";
      ctx.beginPath(); ctx.arc(pts[0][0],pts[0][1],12,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=palette.a;
      ctx.beginPath(); ctx.arc(pts[pts.length-1][0],pts[pts.length-1][1],14,0,Math.PI*2); ctx.fill();
    }

    ctx.fillStyle = palette.b;
    ctx.font = "600 34px Poppins";
    ctx.textBaseline = "top";
    ctx.fillText(SPORT_LABEL[activity.sport] || (activity.sport||"").toUpperCase(), 90, 108);

    ctx.fillStyle = "#96939a";
    ctx.font = "400 28px Poppins";
    ctx.fillText(activity.location + "  ·  " + activity.date, 90, 156);

    ctx.fillStyle = "#f4f2f0";
    ctx.font = "800 72px Poppins";
    var words = activity.name.toUpperCase().split(" ");
    var line1, line2 = "";
    if(words.length > 2){
      var mid = Math.ceil(words.length/2);
      line1 = words.slice(0,mid).join(" ");
      line2 = words.slice(mid).join(" ");
    } else {
      line1 = words.join(" ");
    }
    ctx.fillText(line1, 90, 216);
    if(line2) ctx.fillText(line2, 90, 296);

    ctx.strokeStyle = "rgba(255,255,255,.14)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(90,1392); ctx.lineTo(W-90,1392); ctx.stroke();

    var stats = [
      ["DISTANCE", (activity.distance_m/1000).toFixed(2) + " km"],
      ["TEMPS", fmtTime(activity.moving_time_s)]
    ];
    var pace = fmtPace(activity.distance_m, activity.moving_time_s, activity.sport);
    if(pace) stats.push(["ALLURE", pace]);
    if(activity.elevation_gain_m != null) stats.push(["D+", Math.round(activity.elevation_gain_m) + " m"]);
    if(activity.calories) stats.push(["CALORIES", String(Math.round(activity.calories))]);

    var padX=90, colW=(W-2*padX)/2, boxY0=1428, rowH=128;
    stats.forEach(function(s,i){
      var col = i%2, row = Math.floor(i/2);
      var x = padX + col*colW, y = boxY0 + row*rowH;
      ctx.fillStyle="#96939a";
      ctx.font="500 26px Poppins";
      ctx.fillText(s[0], x, y);
      ctx.fillStyle="#f4f2f0";
      ctx.font="800 50px Poppins";
      ctx.fillText(s[1], x, y+32);
    });

    ctx.fillStyle="#6f6c72";
    ctx.font="400 24px Poppins";
    ctx.fillText("GÉNÉRÉ AUTOMATIQUEMENT · TRACEUR", 90, H-90);
  }

  // ---------------------------------------------------------------
  // UI wiring
  // ---------------------------------------------------------------
  var listEl = document.getElementById("activity-list");
  var screenHome = document.getElementById("screen-home");
  var screenStory = document.getElementById("screen-story");
  var canvas = document.getElementById("story-canvas");
  var canvasOverlay = document.getElementById("canvas-overlay");
  var storyTitle = document.getElementById("story-title");
  var swatchesEl = document.getElementById("swatches");
  var toastEl = document.getElementById("toast");
  var accountDot = document.getElementById("account-dot");
  var accountLabel = document.getElementById("account-label");
  var connectPanel = document.getElementById("connect-panel");
  var connectBtn = document.getElementById("connect-btn");
  var connectedRow = document.getElementById("connected-row");
  var connectedLabel = document.getElementById("connected-label");
  var refreshBtn = document.getElementById("refresh-btn");

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 3200);
  }

  function setAccountUI(){
    if(state.connectStatus === "connected"){
      accountDot.className = "dot ok";
      accountLabel.textContent = "Strava · " + (state.athleteName || "Connecté");
      connectPanel.style.display = "none";
      connectedRow.style.display = "flex";
      connectedLabel.textContent = "Connecté · " + (state.athleteName || "Strava");
    } else if(state.connectStatus === "connecting"){
      accountDot.className = "dot busy";
      accountLabel.textContent = "Connexion…";
      connectPanel.style.display = "flex";
      connectedRow.style.display = "none";
      connectBtn.disabled = true;
      connectBtn.textContent = "Connexion…";
    } else {
      accountDot.className = state.connectStatus === "error" ? "dot warn" : "dot";
      accountLabel.textContent = "Hors-ligne";
      connectPanel.style.display = "flex";
      connectedRow.style.display = "none";
      connectBtn.disabled = false;
      connectBtn.textContent = "Se connecter avec Strava";
    }
  }

  function buildList(){
    listEl.innerHTML = "";
    state.activities.forEach(function(a){
      var card = document.createElement("div");
      card.className = "activity-card";
      var pace = fmtPace(a.distance_m, a.moving_time_s, a.sport);
      card.innerHTML =
                '<div class="ac-top">'+
          '<div class="ac-icon">'+(SPORT_ICON[a.sport]||"🏅")+'</div>'+
          '<div>'+
            '<div class="ac-title">'+a.name+'</div>'+
            '<div class="ac-sub">'+(a.demo ? '<span class="demo-pill">Exemple</span> ' : '')+[a.location,a.date].filter(Boolean).join(' · ')+'</div>'+
          '</div>'+
          '<div class="ac-cta">Générer →</div>'+
        '</div>'+
        '<div class="ac-stats">'+
          '<div class="ac-stat"><b>'+(a.distance_m/1000).toFixed(2)+' km</b><span>Distance</span></div>'+
          '<div class="ac-stat"><b>'+fmtTime(a.moving_time_s)+'</b><span>Temps</span></div>'+
          (pace ? '<div class="ac-stat"><b>'+pace+'</b><span>Allure</span></div>' : '')+
        '</div>';
      card.addEventListener("click", function(){ openStory(a); });
      listEl.appendChild(card);
    });
  }

  function buildSwatches(){
    swatchesEl.innerHTML = "";
    PALETTES.forEach(function(p, i){
      var el = document.createElement("div");
      el.className = "swatch" + (i===state.paletteIndex ? " selected" : "");
      el.style.background = "linear-gradient(135deg,"+p.a+","+p.b+")";
      el.title = p.name;
      el.addEventListener("click", function(){
        state.paletteIndex = i;
        buildSwatches();
        draw();
      });
      swatchesEl.appendChild(el);
    });
  }

  function draw(){
    if(!state.activity) return;
    renderStory(canvas, state.activity, PALETTES[state.paletteIndex]);
  }

  function showOverlay(msg){
    canvasOverlay.textContent = msg;
    canvasOverlay.classList.add("show");
  }
  function hideOverlay(){
    canvasOverlay.classList.remove("show");
  }


  // ---------------------------------------------------------------
  // Décodage polyline (format Google, utilisé par Strava)
  // ---------------------------------------------------------------
  function decodePolyline(str){
    var index=0, lat=0, lng=0, coords=[];
    while(index < str.length){
      var b, shift=0, result=0;
      do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while(b >= 0x20);
      lat += (result & 1) ? ~(result >> 1) : (result >> 1);
      shift=0; result=0;
      do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while(b >= 0x20);
      lng += (result & 1) ? ~(result >> 1) : (result >> 1);
      coords.push([lat/1e5, lng/1e5]);
    }
    return coords;
  }

  async function openStory(activity){
    state.activity = activity;
    storyTitle.textContent = activity.name;
    screenHome.classList.remove("active");
    screenStory.classList.add("active");
    buildSwatches();
    hideOverlay();
    if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
    draw();
    window.scrollTo(0,0);
  }

  document.getElementById("back-btn").addEventListener("click", function(){
    screenStory.classList.remove("active");
    screenHome.classList.add("active");
  });

  document.getElementById("regen-btn").addEventListener("click", function(){
    draw();
    toast("Aperçu régénéré");
  });

  // Sur téléphone : feuille de partage native (→ Instagram directement).
  // Sur ordi : téléchargement classique du PNG.
  document.getElementById("save-btn").addEventListener("click", function(){
    canvas.toBlob(async function(blob){
      if(!blob){ toast("Erreur de génération"); return; }
      var filename = "story-" + (state.activity ? state.activity.id : "traceur") + ".png";
      var file = new File([blob], filename, {type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:"Ma story Traceur"}); return; }
        catch(e){ if(e && e.name === "AbortError") return; }
      }
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast("Image enregistrée ✓");
    }, "image/png");
  });

  // ---------------------------------------------------------------
  // Connexion Strava (via le serveur Traceur)
  // ---------------------------------------------------------------
  var ERREURS = {
    refus: "Connexion Strava annulée.",
    token: "Strava a refusé la connexion — réessaie.",
    reseau: "Problème réseau pendant la connexion — réessaie."
  };

  async function loadActivities(){
    var r = await fetch("/api/activities", {credentials:"same-origin"});
    if(r.status === 401){ state.connectStatus = "idle"; state.activities = DEMO_ACTIVITIES.slice(); buildList(); setAccountUI(); toast("Session expirée — reconnecte-toi"); return; }
    if(r.status === 429){ toast("Trop de requêtes Strava, réessaie dans 15 min"); return; }
    if(!r.ok){ toast("Strava ne répond pas pour le moment"); return; }
    var data = await r.json();
    var acts = (data.activities || []).map(function(a){
      return {
        id:a.id, name:a.name || "Sortie", sport:a.sport || "Run", demo:false,
        distance_m:a.distance_m, moving_time_s:a.moving_time_s,
        elevation_gain_m:a.elevation_gain_m, calories:a.calories,
        location:a.location || "", date:fmtDateFR(a.start_local),
        route: decodePolyline(a.polyline)
      };
    });
    if(acts.length){ state.activities = acts; }
    else { state.activities = DEMO_ACTIVITIES.slice(); toast("Aucune sortie avec tracé GPS — exemples affichés"); }
    buildList();
  }

  async function init(){
    var params = new URLSearchParams(location.search);
    var err = params.get("erreur");
    if(err){ toast(ERREURS[err] || "Connexion impossible"); history.replaceState(null, "", "/"); }
    try{
      var me = await (await fetch("/api/me", {credentials:"same-origin"})).json();
      if(me.connected){
        state.athleteName = me.firstname || "Athlète";
        state.connectStatus = "connected";
        setAccountUI();
        await loadActivities();
      }
    }catch(e){ /* hors-ligne : on reste sur les exemples */ }
  }

  connectBtn.addEventListener("click", function(){
    state.connectStatus = "connecting"; setAccountUI();
    location.href = "/auth/strava";
  });
  refreshBtn.addEventListener("click", function(){
    loadActivities().then(function(){ toast("Sorties actualisées"); });
  });
  document.getElementById("logout-btn").addEventListener("click", async function(){
    await fetch("/auth/logout", {method:"POST", credentials:"same-origin"});
    state.connectStatus = "idle"; state.athleteName = null;
    state.activities = DEMO_ACTIVITIES.slice();
    buildList(); setAccountUI(); toast("Déconnecté");
  });

  buildList();
  setAccountUI();
  init();
})();
</script>
